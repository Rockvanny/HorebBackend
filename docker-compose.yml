services:
  postgres:
    image: postgres:13
    container_name: postgres-1
    restart: always
    environment:
      - POSTGRES_DB=Horeb
      - POSTGRES_USER=Admin
      - POSTGRES_PASSWORD=BdH0r3b2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata_vol:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-1
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@horeb.com
      - PGADMIN_DEFAULT_PASSWORD=4dm1nH0r3b*2026
    ports:
      - "5050:80"
    networks:
      - app-network

  backend:
    build: .
    container_name: server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=Horeb
      - DB_USER=Admin
      - DB_PASSWORD=BdH0r3b2026
      - PORT=3000
    volumes:
      - /usr/src/app/node_modules
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  pgdata_vol:

networks:
  app-network:
    driver: bridge
